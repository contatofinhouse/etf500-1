name: ETF500 Full History Load

on:
  workflow_dispatch: # Botão para executar manualmente no painel do GitHub
  schedule:
    # Executa no 1o dia de cada mês às 03:00 UTC (00:00 BRT)
    - cron: '0 3 1 * *'

jobs:
  run-full-load:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas requests python-dotenv

      - name: Executar Carga Completa de Histórico
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          python bot_cotacoes.py --full-load
